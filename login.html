<!DOCTYPE html>
<!-- FireGen V3.0 — login.html (versión visible eliminada de la interfaz en Fase 2.5, Etapa 2: Refinamiento Móvil) -->
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description"
        content="FireGen V3.0 - Plataforma Profesional para la Administración del Departamento de Jóvenes.">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://www.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://*.firebaseio.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com wss://*.firebaseio.com https://cdn.jsdelivr.net https://www.gstatic.com; frame-src 'self' https://*.firebaseapp.com; base-uri 'self'; form-action 'self';">
    <meta name="theme-color" content="#ea580c">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <link rel="icon" href="assets/icons/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
    <link rel="manifest" href="manifest.webmanifest">
    <title>FireGen | Login</title>
    <!-- Preconnect para reducir latencia de fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome 6.0.0 con SRI -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"
        integrity="sha384-3B6NwesSXE7YJlcLI9RpRqGf2p/EgVH8BgoKTaUrmKNDkHPStTQ3EyoYjCGXaOTS" crossorigin="anonymous">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
        }

        .gradient-text {
            background: linear-gradient(135deg, #f97316, #ea580c);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Background decoration -->
    <div
        class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-orange-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20">
    </div>
    <div
        class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20">
    </div>

    <div class="login-card p-8 relative z-10">
        <div class="text-center mb-8">
            <div class="w-24 max-w-full aspect-square mx-auto mb-4 relative">
                <!-- Mostramos el logo/icono oficial. Si no carga, se muestra el icono default de respaldo -->
                <img src="assets/icons/icon-192.png" alt="FireGen Logo"
                    class="w-full h-full object-contain rounded-2xl shadow-lg shadow-orange-500/30 bg-white"
                    onerror="this.onerror=null; this.outerHTML='<div class=\'w-20 h-20 bg-gradient-to-tr from-orange-600 to-orange-400 rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-orange-500/30\'><i class=\'fas fa-fire text-4xl text-white\'></i></div>'">
            </div>
            <p class="text-sm font-bold text-slate-400 mt-1 uppercase tracking-wider">Acceso Administrativo</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1 ml-1 uppercase">Correo Electrónico</label>
                <div class="relative">
                    <i class="fas fa-envelope absolute left-4 top-3.5 text-slate-400"></i>
                    <input type="email" id="emailInput" required autocomplete="username"
                        class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl pl-10 pr-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition-all">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1 ml-1 uppercase">Contraseña</label>
                <div class="relative">
                    <i class="fas fa-lock absolute left-4 top-3.5 text-slate-400"></i>
                    <input type="password" id="passwordInput" required autocomplete="current-password"
                        class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl pl-10 pr-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition-all">
                </div>
            </div>

            <!-- Error message container -->
            <div id="errorMsg"
                class="hidden bg-red-50 text-red-600 text-xs font-bold p-3 rounded-lg border border-red-100 flex items-start gap-2">
                <i class="fas fa-exclamation-circle mt-0.5"></i>
                <span id="errorText">Credenciales incorrectas.</span>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-orange-500/20 transition-all flex items-center justify-center gap-2">
                <i class="fas fa-sign-in-alt"></i>
                <span>Ingresar al Sistema</span>
            </button>
        </form>

        <div class="mt-6 text-center text-[10px] text-slate-400 font-bold uppercase tracking-widest">
            Solo Administradores
        </div>
    </div>

    <!-- Firebase SDK Compat v9.18.0 -->
    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-auth-compat.js"></script>

    <!-- App Scripts (build 3.7.3 — misma versión que index.html / SW) -->
    <script src="js/version.js?v=3.7.3"></script>
    <script src="js/pwa.js?v=3.7.3"></script>
    <script src="js/firebase-config.js?v=3.7.3"></script>
    <script src="js/config.js?v=3.7.3"></script>
    <script>
        if (typeof FiregenPWA !== 'undefined') {
            FiregenPWA.init({ splash: false, connectionBanner: false });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            const submitBtn = document.getElementById('submitBtn');

            // 1. Revisar si ya hay sesión activa
            auth.onAuthStateChanged(user => {
                if (user) {
                    // Ya está autenticado, redirigir directo
                    window.location.replace('index.html');
                }
            });

            // 2. Manejo de formulario
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                errorMsg.classList.add('hidden');

                const email = document.getElementById('emailInput').value.trim();
                const password = document.getElementById('passwordInput').value;

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Verificando...';
                submitBtn.classList.add('opacity-75');

                auth.signInWithEmailAndPassword(email, password)
                    .then((userCredential) => {
                        // Exitoso! onAuthStateChanged hará el redirect automáticamente
                        submitBtn.innerHTML = '<i class="fas fa-check"></i> Acceso concedido';
                        submitBtn.classList.replace('from-orange-500', 'from-green-500');
                        submitBtn.classList.replace('to-orange-600', 'to-green-600');
                    })
                    .catch((error) => {
                        console.error("Error login:", error.code);
                        errorMsg.classList.remove('hidden');

                        if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                            errorText.textContent = 'Correo o contraseña incorrectos.';
                        } else if (error.code === 'auth/network-request-failed') {
                            errorText.textContent = 'Error de red. Verifica tu conexión a internet.';
                        } else if (error.code === 'auth/invalid-email') {
                            errorText.textContent = 'Formato de correo inválido.';
                        } else {
                            errorText.textContent = 'Ocurrió un error. Intenta nuevamente.';
                        }

                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> <span>Ingresar al Sistema</span>';
                        submitBtn.classList.remove('opacity-75');
                    });
            });
        });
    </script>
</body>

</html>
